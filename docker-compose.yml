# Local integration test of the containerized stack — proves the Dockerfiles
# work and the two services can talk to each other, before anything touches AWS.
#
# Usage:
#   cp .env.example .env   # fill in GROQ_API_KEY, set PORTAL_API_KEY to any secret string
#   docker compose up --build

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORTAL_API_KEY=${PORTAL_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:8501
    volumes:
      - api-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api:8000
      - PORTAL_API_KEY=${PORTAL_API_KEY}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
